name: Build

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
    paths-ignore:
      - 'assets/**'
      - '**/*.md'
      - '**/*.png'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'assets/**'
      - '**/*.md'
      - '**/*.png'

permissions:
  contents: read

env:
  # Non-tag builds use 1.18.<run_number> for the VERSIONINFO resource.
  UNTAGGED_VERSION_PREFIX: '1.18'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            msvc_arch: x86
          - platform: x64
            msvc_arch: amd64
          - platform: ARM64
            msvc_arch: amd64_arm64

    env:
      VCPKG_CACHE_PATH: ${{ github.workspace }}\.vcpkg-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize vcpkg submodule
        run: git submodule update --init vcpkg

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Install vpatch
        shell: pwsh
        run: |
          dotnet tool install --global Nefarius.Tools.Vpatch --version 2.7.0
          $tools = Join-Path $env:USERPROFILE '.dotnet' 'tools'
          "$tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve vcpkg revision
        id: vcpkg
        shell: pwsh
        run: |
          $rev = git -C vcpkg rev-parse HEAD
          "head=$rev" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "vcpkg HEAD $rev"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_CACHE_PATH }}
          key: vcpkg-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ steps.vcpkg.outputs.head }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.platform }}-

      - name: Install vcpkg dependencies
        shell: cmd
        run: prepare-deps.bat ${{ matrix.platform }}

      - name: Stamp version resource
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)$') {
            $ver = $Matches[1]
          } else {
            $ver = "$env:UNTAGGED_VERSION_PREFIX.$env:GITHUB_RUN_NUMBER"
          }
          Write-Host "Stamping version $ver"
          vpatch --stamp-version $ver --target-file ".\src\NefConUtil.rc" --resource.file-version --resource.product-version
          if ($LASTEXITCODE -ne 0) {
            throw "vpatch failed with exit code $LASTEXITCODE"
          }

      - name: Build Release configurations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configurations = @('Release (Console)', 'Release (WinMain)')
          foreach ($configuration in $configurations) {
            $succeeded = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              msbuild "$env:GITHUB_WORKSPACE\NefConUtil.sln" `
                /p:Configuration="$configuration" `
                /p:Platform="${{ matrix.platform }}" `
                /m
              if ($LASTEXITCODE -eq 0) {
                $succeeded = $true
                break
              }
              if ($attempt -lt 3) {
                Write-Warning "Build attempt $attempt/3 failed for '$configuration' (exit code $LASTEXITCODE), retrying in 15 seconds..."
                Start-Sleep -Seconds 15
              }
            }
            if (-not $succeeded) {
              throw "Build failed after 3 attempts for '$configuration' (${{ matrix.platform }})"
            }
          }

      - name: Stage binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $platform = '${{ matrix.platform }}'
          $candidates = @(
            (Join-Path 'bin' $platform),
            (Join-Path 'bin' 'Win32')
          )
          $src = $candidates | Where-Object {
            (Test-Path -LiteralPath (Join-Path $_ 'nefconc.exe')) -and
            (Test-Path -LiteralPath (Join-Path $_ 'nefconw.exe'))
          } | Select-Object -First 1
          if (-not $src) {
            if (Test-Path 'bin') {
              Get-ChildItem -Path bin -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            }
            throw "Could not find nefconc.exe and nefconw.exe for $platform"
          }
          $dst = Join-Path 'staged' $platform
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item -Path (Join-Path $src '*.exe') -Destination $dst
          Write-Host "Staged binaries from $src to $dst"

      - name: Upload unsigned binaries
        uses: actions/upload-artifact@v4
        with:
          name: nefcon-${{ matrix.platform }}
          path: staged/${{ matrix.platform }}/
          if-no-files-found: error

  release:
    name: Sign and publish
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Validate tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag '$env:GITHUB_REF_NAME' does not match vX.Y.Z"
          }

      - name: Download unsigned binaries
        uses: actions/download-artifact@v4
        with:
          pattern: nefcon-*
          path: artifacts

      - name: Assemble release tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $map = @{
            'nefcon-x86' = 'x86'
            'nefcon-x64' = 'x64'
            'nefcon-ARM64' = 'ARM64'
          }
          foreach ($name in $map.Keys) {
            $src = Join-Path 'artifacts' $name
            $dst = Join-Path 'bin' $map[$name]
            if (-not (Test-Path -LiteralPath $src)) {
              throw "Missing artifact directory '$src'"
            }
            New-Item -ItemType Directory -Path $dst -Force | Out-Null
            $exes = @(Get-ChildItem -Path $src -Filter '*.exe' -File -Recurse)
            if ($exes.Count -eq 0) {
              throw "No .exe files found under '$src'"
            }
            Copy-Item -Path $exes.FullName -Destination $dst
          }

          $expected = @(
            'bin\x86\nefconc.exe',
            'bin\x86\nefconw.exe',
            'bin\x64\nefconc.exe',
            'bin\x64\nefconw.exe',
            'bin\ARM64\nefconc.exe',
            'bin\ARM64\nefconw.exe'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing expected binary '$file'"
            }
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Sign binaries
        uses: nefarius/SignRelay@v1.0.0-pre008
        with:
          server: https://signrelay.api.nefarius.systems/
          token: ${{ secrets.SIGN_RELAY_CI_TOKEN }}
          files: |
            ./bin/**/*.exe
          in-place: 'true'
          timeout: '00:45:00'
          tool-version: '1.0.0-pre008'

      - name: Package signed zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $zip = Join-Path $pwd "nefcon_$tag.zip"
          if (Test-Path -LiteralPath $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          Compress-Archive -Path (Join-Path $pwd 'bin\*') -DestinationPath $zip
          Write-Host "Created $zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $zip = "nefcon_$tag.zip"

          $previousNativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            gh release view $tag --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) {
              gh release create $tag --draft --title $tag --generate-notes
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to create draft release for '$tag'."
              }
            }

            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload asset to release '$tag'."
            }

            gh release edit $tag --draft=false
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish release '$tag'."
            }
          }
          finally {
            $PSNativeCommandUseErrorActionPreference = $previousNativePreference
          }
